[package]
name = "backend-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.12"
prost = "0.13"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
tonic-build = "0.12"

# Dummy bin target so `nx run backend-rust:generate` (cargo build --release
# --bin codegen-check) can trigger build.rs codegen without building the
# full server binary.
[[bin]]
name = "codegen-check"
path = "src/bin/codegen_check.rs"

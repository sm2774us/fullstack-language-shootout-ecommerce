# Reference HorizontalPodAutoscaler for one backend. Copy this block
# (renaming metadata.name/spec.scaleTargetRef.name) for each of the other
# ten backends and for frontend-web — they're intentionally identical so
# autoscaling behavior doesn't itself become a confounding variable in the
# language comparison.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-python
  namespace: ecommerce-shootout
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-python
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30

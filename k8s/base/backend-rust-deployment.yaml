apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-rust
  namespace: ecommerce-shootout
  labels: { app: backend-rust }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend-rust }
  template:
    metadata:
      labels: { app: backend-rust }
    spec:
      containers:
        - name: backend-rust
          image: backend-rust:latest
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend-rust
  namespace: ecommerce-shootout
spec:
  selector: { app: backend-rust }
  ports: [{ port: 8080, targetPort: 8080 }]

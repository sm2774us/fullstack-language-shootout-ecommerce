[project]
name = "backend-python"
version = "0.1.0"
description = "Python (FastAPI + grpc.aio) reference backend for the polyglot e-commerce shootout"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8.3", "httpx>=0.27"]
